[project]
name = "rankr"
version = "0.1.0"
description = "A platform for aggregating different academic rankings."
authors = [{ name = "Pooria Soltani", email = "pooria.ms@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
keywords = ["university-ranking", "ranking-systems", "grid"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Education",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Typing :: Typed",
]

dependencies = [
  "requests>=2.24.0,<3",
  "beautifulsoup4>=4.9.1,<5",
  "sqlalchemy>=2.0,<3",
  "furl>=2.1.0,<3",
  "tqdm>=4.48.2,<5",
  "fuzzywuzzy[speedup]>=0.18.0,<1",
  "typer>=0.3.2,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "selenium>=3.141.0,<4",
]

[project.urls]
homepage = "https://github.com/pmsoltani/rankr"
repository = "https://github.com/pmsoltani/rankr"
documentation = "https://github.com/pmsoltani/rankr"

[project.scripts]
rankr = "cli.cli:cli"

[dependency-groups]
dev = [
  "ruff>=0.15",
  "ty>=0.0.1a1",
  "pytest>=6.0.1",
  "pytest-cov>=2.10.1",
  "devtools[pygments]>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "config", "rankr", "utils"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes (flake8 parity).
select = ["E", "F", "W"]
extend-select = ["I", "RUF022"]
ignore = ["E501"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# re-exports in package inits; alembic env preamble does path setup before imports
"**/__init__.py" = ["F401"]
"**/migrations/env.py" = ["E402", "F401"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
all = "warn"
# Requiring @typing.override on dunder overrides (e.g. __repr__) is noise.
missing-override-decorator = "ignore"


[tool.coverage.run]
omit = [".venv/*"]
